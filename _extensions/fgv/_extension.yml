title: FGV
author: LabDados FGV Direito SP
version: 2.0.0
quarto-required: ">=1.9.0"
contributes:
  formats:
    revealjs:
      theme:
        - default
        - fgv.scss
      css: fgv-extras.css
      slide-number: c/t
      show-slide-number: all
      transition: none
      background-transition: none
      progress: true
      history: true
      hash-type: number
      controls: true
      touch: true
      center: false
      width: 1280
      height: 720
      margin: 0.06
      min-scale: 0.2
      max-scale: 2.0
      highlight-style: github
      code-copy: true
      code-overflow: wrap
      link-external-newwindow: true
      lang: pt
      menu:
        side: right
        numbers: true
