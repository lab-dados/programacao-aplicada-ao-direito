project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - aulas/*/slides.qmd
  resources:
    - aulas/**/*.ipynb

website:
  title: "Programação Aplicada ao Direito"
  description: "Curso de programação em Python do LabDados, FGV Direito SP."
  site-url: https://lab-dados.github.io/programacao-aplicada-ao-direito/
  repo-url: https://github.com/lab-dados/programacao-aplicada-ao-direito
  navbar:
    background: "#023A78"
    foreground: "#FFFFFF"
    left:
      - text: "Início"
        href: index.qmd
      - text: "Slides do Encontro 1"
        href: aulas/01-introducao/slides.qmd
      - text: "Slides do Encontro 2"
        href: aulas/02-tipos-e-funcoes/slides.qmd
    right:
      - icon: github
        href: https://github.com/lab-dados/programacao-aplicada-ao-direito
        aria-label: Repositório no GitHub

format:
  html:
    theme: [cosmo, _extensions/fgv/site.scss]
    toc: true
    toc-title: "Nesta página"
    toc-depth: 2
    lang: pt
    link-external-newwindow: true
    code-copy: true
    highlight-style: github

lang: pt
